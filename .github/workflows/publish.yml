# REDSUN: releases are GitHub release assets built from `packages/cli`, not npm
# packages built from `packages/opencode`. This replaces upstream's workflow
# wholesale and follows dev's shape: one runner, Bun cross-compiles every
# target, `script/publish.ts` archives them, and the installers ship alongside
# the binaries so `redsun upgrade` can fetch a version-matched copy.
name: publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.3.1)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        timeout-minutes: 1
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            echo "No tag found"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: ${VERSION} (tag: ${TAG})"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun turbo typecheck --concurrency=3
        timeout-minutes: 15

      - name: Test core
        run: cd packages/core && bun run test
        timeout-minutes: 20
        env:
          CI: true

      - name: Test tui
        run: cd packages/tui && bun test
        timeout-minutes: 15
        env:
          CI: true

      - name: Build, smoke test, and create release archives
        run: cd packages/cli && bun run script/publish.ts
        timeout-minutes: 60
        env:
          REDSUN_VERSION: ${{ steps.version.outputs.version }}
          REDSUN_CHANNEL: release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redsun-binaries
          path: |
            packages/cli/dist/*.tar.gz
            packages/cli/dist/*.zip

      # Draft, like dev: the release is reviewed and published by hand, and
      # `install`/`install.ps1` are attached so `releases/latest/download/install`
      # resolves for both a fresh install and `redsun upgrade`.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            packages/cli/dist/*.tar.gz
            packages/cli/dist/*.zip
            install
            install.ps1
