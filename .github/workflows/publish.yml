name: publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        timeout-minutes: 1
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            echo "No tag found"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: ${VERSION} (tag: ${TAG})"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun turbo typecheck
        timeout-minutes: 10

      - name: Test
        run: cd packages/redsun && bun test
        timeout-minutes: 10
        env:
          CI: true

      - name: Build, smoke test, and create release archives
        run: cd packages/redsun && bun run script/publish.ts
        timeout-minutes: 20
        env:
          REDSUN_VERSION: ${{ steps.version.outputs.version }}
          REDSUN_CHANNEL: release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redsun-binaries
          path: |
            packages/redsun/dist/*.tar.gz
            packages/redsun/dist/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: redsun ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            packages/redsun/dist/*.tar.gz
            packages/redsun/dist/*.zip
            install
            install.ps1
