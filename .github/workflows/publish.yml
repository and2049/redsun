# REDSUN: releases are GitHub release assets built from `packages/cli`, not npm
# packages built from `packages/opencode`. This replaces upstream's workflow
# wholesale and follows dev's shape: one runner, Bun cross-compiles every
# target, `script/publish.ts` archives them, and the installers ship alongside
# the binaries so `redsun upgrade` can fetch a version-matched copy.
#
# Trigger: a push to the `latest` branch (i.e. merging `dev` into `latest`).
# The version tag is derived from the calendar date as `vYY-M-D.N`, where N is
# the same-day index that lets multiple merges in one day each get their own
# tag. The draft release reserves the tag; publishing the draft creates it.
name: publish

on:
  push:
    branches:
      - latest
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v26-8-28.0)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            # GitHub runners are UTC; %-m/%-d drop leading zeros to match vYY-M-D.
            PREFIX="v$(date -u +%y)-$(date -u +%-m)-$(date -u +%-d)"
            # Existing releases (drafts included) fix the same-day index N so
            # repeated merges into `latest` never reuse a tag.
            EXISTING=$(gh release list --limit 200 --json tagName \
              --jq ".[].tagName | select(startswith(\"${PREFIX}.\"))" || true)
            N=0
            for t in $EXISTING; do
              n="${t##*.}"
              if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -ge "$N" ]; then
                N=$((n + 1))
              fi
            done
            TAG="${PREFIX}.${N}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION} (tag: ${TAG})"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun turbo typecheck --concurrency=3
        timeout-minutes: 15

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Test core
        run: cd packages/core && bun run test
        timeout-minutes: 20
        env:
          CI: true

      - name: Test tui
        run: cd packages/tui && bun test
        timeout-minutes: 15
        env:
          CI: true

      - name: Build, smoke test, and create release archives
        run: cd packages/cli && bun run script/publish.ts
        timeout-minutes: 60
        env:
          REDSUN_VERSION: ${{ steps.version.outputs.version }}
          REDSUN_CHANNEL: release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redsun-binaries
          path: |
            packages/cli/dist/*.tar.gz
            packages/cli/dist/*.zip

      # Draft, like dev: the release is reviewed and published by hand, and
      # `install`/`install.ps1` are attached so `releases/latest/download/install`
      # resolves for both a fresh install and `redsun upgrade`.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            packages/cli/dist/*.tar.gz
            packages/cli/dist/*.zip
            install
            install.ps1
