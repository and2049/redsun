# REDSUN: upstream's version drove `packages/app` (Playwright) and
# `packages/www`, neither of which this fork has. This is dev's shape retargeted
# at the v2 packages: typecheck, the two suites the port gates on, and a drift
# check on generated client code.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun turbo typecheck --concurrency=3
        timeout-minutes: 15

      - name: Lint
        run: bun lint
        timeout-minutes: 5

      - name: Test Effect simplification rules
        run: bun run test:effect-simplification-rules
        timeout-minutes: 5

      - name: Check Effect simplifications
        run: bun run lint:effect-simplifications
        timeout-minutes: 5

      - name: Test core
        run: cd packages/core && bun run test
        timeout-minutes: 20
        env:
          CI: true

      - name: Test tui
        run: cd packages/tui && bun test
        timeout-minutes: 15
        env:
          CI: true

