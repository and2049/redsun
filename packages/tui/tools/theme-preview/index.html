<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>redsun theme preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #131316;
    color: #c9c9ce;
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 18px;
  }

  /* ---- tool chrome (not themed) ---- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    width: min(1500px, 100%);
  }
  .toolbar h1 { font-size: 14px; font-weight: 600; color: #e8e8ec; }
  .toolbar .dot { width: 8px; height: 8px; border-radius: 50%; background: #e05252; }
  .toolbar .dot.live { background: #3ecf7a; }
  .toolbar select {
    background: #1f1f24; color: #e8e8ec; border: 1px solid #33333a;
    border-radius: 6px; padding: 4px 8px; font: inherit;
  }
  .toolbar button {
    background: #1f1f24; color: #c9c9ce; border: 1px solid #33333a;
    border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer;
  }
  .toolbar button.active { color: #e8e8ec; border-color: #6b6b76; }
  .toolbar .hint { color: #77777e; font-size: 12px; margin-left: auto; }
  .save-note { color: #3ecf7a; font-size: 12px; opacity: 0; transition: opacity .3s; }
  .save-note.show { opacity: 1; }
  .error-note { color: #e0a852; font-size: 12px; }
  .render-note { color: #77777e; font-size: 12px; }
  .hidden { display: none; }

  .stage { display: flex; gap: 14px; align-items: flex-start; }

  /* ---- the terminal frame ---- */
  .screen {
    border: 1px solid #000;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .screen pre {
    font: 13px/1.25 "Cascadia Mono", Consolas, ui-monospace, monospace;
    padding: 8px 10px;
  }
  .screen pre span { white-space: pre; }

  /* legend */
  .legend {
    width: 320px; max-height: 740px; overflow-y: auto;
    background: #1a1a1f; border: 1px solid #2b2b31; border-radius: 10px;
    padding: 12px;
  }
  .legend h3 { font-size: 11px; letter-spacing: .08em; color: #8b8b93; margin: 10px 0 6px; }
  .legend h3:first-child { margin-top: 0; }
  .lrow { display: flex; gap: 8px; padding: 4px 5px; border-radius: 6px; align-items: center; cursor: pointer; }
  .lrow .swatch { width: 17px; height: 17px; border-radius: 4px; border: 1px solid rgba(255,255,255,.14); flex: none; }
  .lrow .name { font-family: Consolas, monospace; font-size: 12px; color: #e2e2e7; }
  .lrow .hex { font-family: Consolas, monospace; font-size: 11px; color: #8b8b93; margin-left: 5px; }
  .lrow:hover { background: #232329; }
  .lrow.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { background: #3a5f43; } 100% { background: transparent; } }

  /* ---- color picker popover (from echo) ---- */
  .picker {
    position: fixed; z-index: 50; width: 216px;
    background: #1f1f24; border: 1px solid #3a3a42; border-radius: 10px;
    padding: 10px; box-shadow: 0 10px 32px rgba(0,0,0,.55);
    user-select: none;
  }
  .pk-head { display: flex; align-items: center; margin-bottom: 8px; }
  .pk-key { font-family: Consolas, monospace; font-size: 12px; color: #e8e8ec; }
  .pk-close { margin-left: auto; color: #8b8b93; cursor: pointer; padding: 0 4px; }
  .pk-close:hover { color: #e8e8ec; }
  .pk-sv {
    position: relative; width: 196px; height: 196px; border-radius: 6px; cursor: crosshair;
    background:
      linear-gradient(to top, #000, rgba(0,0,0,0)),
      linear-gradient(to right, #fff, rgba(255,255,255,0)),
      var(--pk-hue, #f00);
  }
  .pk-dot {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6);
    transform: translate(-6px, -6px); pointer-events: none;
  }
  .pk-hue {
    position: relative; height: 12px; border-radius: 6px; margin-top: 10px; cursor: crosshair;
    background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
  }
  .pk-hue-dot {
    position: absolute; top: -2px; width: 8px; height: 16px; border-radius: 4px;
    background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6);
    transform: translateX(-4px); pointer-events: none;
  }
  .pk-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .pk-row input {
    width: 90px; background: #131316; color: #e8e8ec; border: 1px solid #3a3a42;
    border-radius: 6px; padding: 3px 7px; font: 12px Consolas, monospace;
  }
  .pk-swatches { display: flex; margin-left: auto; border-radius: 6px; overflow: hidden; border: 1px solid #3a3a42; }
  .pk-old, .pk-new { width: 26px; height: 20px; }
  .pk-hint { margin-top: 8px; font-size: 10.5px; color: #77777e; }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="dot" id="dot"></span>
    <h1>redsun theme preview</h1>
    <select id="theme-select"></select>
    <button id="tab-session" class="active">session</button>
    <button id="tab-home">home</button>
    <button id="legend-toggle">legend</button>
    <span class="save-note" id="save-note">saved</span>
    <span class="render-note hidden" id="render-note">rendering…</span>
    <span class="error-note hidden" id="parse-error"></span>
    <span class="hint">edit theme assets and save — the real TUI re-renders live</span>
  </div>

  <div class="stage">
    <div class="screen"><pre id="frame"></pre></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="picker hidden" id="color-picker">
    <div class="pk-head"><span class="pk-key" id="pk-key"></span><span class="pk-close" id="pk-close">✕</span></div>
    <div class="pk-sv" id="pk-sv"><div class="pk-dot" id="pk-dot"></div></div>
    <div class="pk-hue" id="pk-hue"><div class="pk-hue-dot" id="pk-hue-dot"></div></div>
    <div class="pk-row">
      <input id="pk-hex" maxlength="9" spellcheck="false">
      <div class="pk-swatches"><div class="pk-old" id="pk-old" title="before"></div><div class="pk-new" id="pk-new" title="after"></div></div>
    </div>
    <div class="pk-hint">release to save to the json · esc closes</div>
  </div>

<script>
  const dot = document.getElementById("dot");
  const select = document.getElementById("theme-select");
  const legend = document.getElementById("legend");
  const frameEl = document.getElementById("frame");
  const parseError = document.getElementById("parse-error");
  const renderNote = document.getElementById("render-note");
  let current =
    new URLSearchParams(location.search).get("theme") ||
    localStorage.getItem("redsun-preview-theme");
  let screen = localStorage.getItem("redsun-preview-screen") || "session";
  let data = null;
  let lastKeys = {};

  const GROUPS = [
    ["CORE", ["primary", "secondary", "accent", "error", "warning", "success", "info"]],
    ["AGENTS", ["agentBuild", "agentPlan", "agentCompose"]],
    ["TEXT + SURFACES", ["text", "textMuted", "selectedListItemText", "background", "backgroundPanel", "backgroundElement", "border", "borderActive", "borderSubtle", "logoGradientStart", "logoGradientEnd"]],
    ["DIFF", null],
    ["MARKDOWN", null],
    ["SYNTAX", null],
  ];

  function groupFor(key) {
    for (const [title, keys] of GROUPS) if (keys && keys.includes(key)) return title;
    if (key.startsWith("diff")) return "DIFF";
    if (key.startsWith("markdown")) return "MARKDOWN";
    if (key.startsWith("syntax")) return "SYNTAX";
    return "OTHER";
  }

  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const css = ([r, g, b, a]) => `rgba(${r},${g},${b},${(a / 255).toFixed(3)})`;

  function spanHtml(s) {
    let style = `color:${css(s.fg)};`;
    if (s.bg[3] !== 0) style += `background:${css(s.bg)};`;
    if (s.attributes & 1) style += "font-weight:bold;";
    if (s.attributes & 2) style += "opacity:.55;";
    if (s.attributes & 4) style += "font-style:italic;";
    if (s.attributes & 8) style += "text-decoration:underline;";
    if (s.attributes & 128) style += "text-decoration:line-through;";
    return `<span style="${style}">${esc(s.text)}</span>`;
  }

  function renderFrame() {
    if (!data) return;
    const frame = data.frames[screen];
    frameEl.innerHTML = frame.lines.map((l) => l.spans.map(spanHtml).join("")).join("\n");
    frameEl.style.background = data.keys.background || "#000";
  }

  function renderLegend() {
    legend.innerHTML = "";
    const buckets = new Map();
    for (const [key, value] of Object.entries(data.keys)) {
      const group = groupFor(key);
      if (!buckets.has(group)) buckets.set(group, []);
      buckets.get(group).push([key, value]);
    }
    const order = ["CORE", "AGENTS", "TEXT + SURFACES", "DIFF", "MARKDOWN", "SYNTAX", "OTHER"];
    for (const group of order) {
      const entries = buckets.get(group);
      if (!entries) continue;
      const h = document.createElement("h3");
      h.textContent = group;
      legend.appendChild(h);
      for (const [key, value] of entries) {
        const row = document.createElement("div");
        row.className = "lrow";
        row.dataset.key = key;
        row.title = "click to edit";
        if (lastKeys[key] !== undefined && lastKeys[key] !== value) row.classList.add("flash");
        row.innerHTML =
          `<span class="swatch" style="background:${value.slice(0, 7)}"></span>` +
          `<span><span class="name">${key}</span><span class="hex">${value}</span></span>`;
        row.addEventListener("click", () => openPicker(key, value, row));
        legend.appendChild(row);
      }
    }
    lastKeys = { ...data.keys };
  }

  async function loadTheme(name) {
    renderNote.classList.remove("hidden");
    try {
      const res = await fetch(`/api/theme/${name}`);
      if (!res.ok) {
        parseError.textContent = `load failed: ${await res.text()}`;
        parseError.classList.remove("hidden");
        return;
      }
      parseError.classList.add("hidden");
      data = await res.json();
      renderFrame();
      renderLegend();
    } finally {
      renderNote.classList.add("hidden");
    }
  }

  async function loadThemeList() {
    const themes = await (await fetch("/api/themes")).json();
    const names = themes.map((t) => t.name);
    if (!names.includes(current)) current = names.includes("dusk") ? "dusk" : names[0];
    const group = (mode) =>
      `<optgroup label="${mode}">` +
      themes
        .filter((t) => t.mode === mode)
        .map((t) => `<option value="${t.name}"${t.name === current ? " selected" : ""}>${t.name}</option>`)
        .join("") +
      `</optgroup>`;
    select.innerHTML = group("dark") + group("light");
    return names;
  }

  select.addEventListener("change", () => {
    current = select.value;
    localStorage.setItem("redsun-preview-theme", current);
    lastKeys = {};
    closePicker();
    loadTheme(current);
  });

  for (const name of ["session", "home"]) {
    document.getElementById(`tab-${name}`).addEventListener("click", () => {
      screen = name;
      localStorage.setItem("redsun-preview-screen", screen);
      document.getElementById("tab-session").classList.toggle("active", screen === "session");
      document.getElementById("tab-home").classList.toggle("active", screen === "home");
      renderFrame();
    });
  }
  document.getElementById("tab-session").classList.toggle("active", screen === "session");
  document.getElementById("tab-home").classList.toggle("active", screen === "home");

  document.getElementById("legend-toggle").addEventListener("click", () => {
    legend.classList.toggle("hidden");
  });

  // ---- editing: square HSV picker that writes back to the json ----
  const picker = document.getElementById("color-picker");
  const pkKey = document.getElementById("pk-key");
  const pkSv = document.getElementById("pk-sv");
  const pkDot = document.getElementById("pk-dot");
  const pkHue = document.getElementById("pk-hue");
  const pkHueDot = document.getElementById("pk-hue-dot");
  const pkHex = document.getElementById("pk-hex");
  const pkOld = document.getElementById("pk-old");
  const pkNew = document.getElementById("pk-new");
  const saveNote = document.getElementById("save-note");
  const pk = { key: null, h: 0, s: 1, v: 1, alpha: "", lastSaved: null };

  function hsvToHex(h, s, v) {
    const f = (n) => {
      const k = (n + h / 60) % 6;
      const c = v - v * s * Math.max(0, Math.min(k, 4 - k, 1));
      return Math.round(c * 255).toString(16).padStart(2, "0");
    };
    return `#${f(5)}${f(3)}${f(1)}`;
  }

  function hexToHsv(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) {
      if (max === r) h = 60 * (((g - b) / d) % 6);
      else if (max === g) h = 60 * ((b - r) / d + 2);
      else h = 60 * ((r - g) / d + 4);
    }
    return { h: (h + 360) % 360, s: max ? d / max : 0, v: max };
  }

  function pkValue() {
    return hsvToHex(pk.h, pk.s, pk.v) + pk.alpha;
  }

  function pkRefresh(fromHexField) {
    const value = pkValue();
    pkSv.style.setProperty("--pk-hue", `hsl(${pk.h}, 100%, 50%)`);
    pkDot.style.left = `${pk.s * 100}%`;
    pkDot.style.top = `${(1 - pk.v) * 100}%`;
    pkHueDot.style.left = `${(pk.h / 360) * 100}%`;
    if (!fromHexField) pkHex.value = value;
    pkNew.style.background = value.slice(0, 7);
    return value;
  }

  function openPicker(key, value, row) {
    pk.key = key;
    Object.assign(pk, hexToHsv(value));
    pk.alpha = value.length === 9 ? value.slice(7) : "";
    pk.lastSaved = value;
    pkKey.textContent = key;
    pkOld.style.background = value.slice(0, 7);
    picker.classList.remove("hidden");
    const rect = row.getBoundingClientRect();
    const height = 320;
    picker.style.left = `${Math.max(8, rect.left - 236)}px`;
    picker.style.top = `${Math.min(Math.max(8, rect.top - 40), window.innerHeight - height)}px`;
    pkRefresh();
  }

  function closePicker() {
    picker.classList.add("hidden");
    pk.key = null;
  }

  async function pkSave() {
    if (!pk.key) return;
    const value = pkValue();
    if (value === pk.lastSaved) return;
    const res = await fetch(`/api/theme/${current}/set`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: pk.key, value }),
    });
    if (res.ok) {
      pk.lastSaved = value;
      saveNote.classList.add("show");
      setTimeout(() => saveNote.classList.remove("show"), 1200);
    } else {
      parseError.textContent = await res.text();
      parseError.classList.remove("hidden");
    }
  }

  function dragControl(el, apply) {
    el.addEventListener("pointerdown", (event) => {
      el.setPointerCapture(event.pointerId);
      const move = (ev) => {
        const rect = el.getBoundingClientRect();
        apply(
          Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width)),
          Math.min(1, Math.max(0, (ev.clientY - rect.top) / rect.height)),
        );
        pkRefresh();
      };
      move(event);
      const up = () => {
        el.removeEventListener("pointermove", move);
        el.removeEventListener("pointerup", up);
        pkSave();
      };
      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
    });
  }

  dragControl(pkSv, (x, y) => { pk.s = x; pk.v = 1 - y; });
  dragControl(pkHue, (x) => { pk.h = Math.min(359.9, x * 360); });

  pkHex.addEventListener("change", () => {
    const value = pkHex.value.trim().toLowerCase();
    if (/^#[0-9a-f]{6}([0-9a-f]{2})?$/.test(value)) {
      Object.assign(pk, hexToHsv(value));
      pk.alpha = value.length === 9 ? value.slice(7) : "";
      pkRefresh(true);
      pkSave();
    }
  });
  document.getElementById("pk-close").addEventListener("click", closePicker);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closePicker();
  });

  function connect() {
    const source = new EventSource("/api/events");
    source.onopen = () => dot.classList.add("live");
    source.onerror = () => dot.classList.remove("live");
    source.onmessage = async (event) => {
      const changed = JSON.parse(event.data);
      await loadThemeList();
      if (changed.includes(current)) loadTheme(current);
    };
  }

  (async () => {
    await loadThemeList();
    localStorage.setItem("redsun-preview-theme", current);
    connect();
    await loadTheme(current);
    const editKey = new URLSearchParams(location.search).get("edit");
    if (editKey) {
      const row = legend.querySelector(`.lrow[data-key="${CSS.escape(editKey)}"]`);
      if (row) row.click();
    }
  })();
</script>
</body>
</html>
